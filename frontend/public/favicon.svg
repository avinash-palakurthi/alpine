<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#064e3b"/>
  <!-- Sky gradient -->
  <rect x="0" y="0" width="32" height="32" rx="16" fill="url(#sky)"/>
  <!-- Mountain back -->
  <polygon points="4,26 14,10 24,26" fill="#065f46" opacity="0.7"/>
  <!-- Mountain front left -->
  <polygon points="0,26 10,14 18,26" fill="#047857"/>
  <!-- Mountain front right peak (main) -->
  <polygon points="12,26 20,8 28,26" fill="#059669"/>
  <!-- Snow cap -->
  <polygon points="20,8 17,14 23,14" fill="white" opacity="0.9"/>
  <!-- Ground -->
  <rect x="0" y="25" width="32" height="7" rx="0" fill="#065f46"/>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
